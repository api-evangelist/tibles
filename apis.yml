name: Tibles
description: 'Tibles is a digital collectibles company building authentic, engaging collecting
  experiences on the Flow blockchain. Its Tibles Clubhouse platform hosts multiple consumer iOS and
  web apps built around licensed intellectual properties — including FuggClub (Fugglers), Sk8tibles
  (Skateboarding Hall of Fame), OneShots (Valiant Comics), Tibles Fraggle Rock and Seussibles (Jim
  Henson / Dr. Seuss), and Aggretsuko (Sanrio) — offering interactive digital trading cards and NFT
  collections with barter-style trading, chat, and community events. Tibles is a Certified Flow
  Developer and publishes open-source Cadence smart contracts and an IPFS desktop client, but exposes
  no public developer API, SDK, or documentation portal. Backed by Multicoin Capital.'
